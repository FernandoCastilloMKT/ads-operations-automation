name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias de pruebas
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validar sintaxis Python
        run: python -m compileall -q scripts tests

      - name: Ejecutar suite local simulada
        run: python -m pytest -q

      - name: Auditar paquete publico
        if: ${{ hashFiles('.public-runner') != '' }}
        run: python scripts/audit_public_repository.py --root .
